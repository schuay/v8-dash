[project]
name = "shepherd"
version = "0.1.0"
description = "Watch Gerrit CLs, triage CQ failures and coordinate a coding agent through a local dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Stdlib only. Optional extras under extras/ state their own dependencies.
dependencies = []

[project.scripts]
shepherd = "shepherd.__main__:main"

[dependency-groups]
dev = ["ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shepherd"]

[tool.uv]
# The dev environment exists for the hooks; installing the package into it
# would need a build backend from the network.
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",      # bugbear correctness checks
    "C4",     # comprehension misuse
    "ISC",    # implicit string concat, i.e. the missing-comma bug
    "PL",     # pylint subset
    "RET",    # return-path smells
    "RUF",
    "S",      # bandit subset
    "SIM",
    "UP",     # pyupgrade
]
ignore = [
    # Asserts in tests are the point.
    "S101",
    # Local imports keep optional dependencies optional.
    "PLC0415",
    # Assertion literals state expected values directly.
    "PLR2004",
    # Complexity refactors need separate review instead of inline suppressions.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Tools such as git, osascript and git-credential-luci are found on PATH.
    "S603",
    "S607",
    # The CLIs call fixed public HTTPS endpoints or the configured Gerrit host.
    "S310",
    # The watcher keeps a module-level request counter for --debug.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S105",  # token-like literals in fixtures are fake by construction
    "S106",
    "S108",  # /tmp paths in tests are the test's own scratch
]
